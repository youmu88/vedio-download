<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>视频下载器</title>
<style>
  html, body { height: 100%; margin: 0; background: #F2F2F7; }
  body { display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif; color: #3C3C43; }
  .picker { text-align: center; padding: 24px; }
  .picker .logo { font-size: 56px; margin-bottom: 12px; }
  .picker h1 { font-size: 22px; font-weight: 700; margin: 0 0 6px; color: #000; }
  .picker p { font-size: 14px; margin: 0 0 24px; }
  .picker .btns { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .picker a {
    text-decoration: none; color: #fff; font-size: 15px; font-weight: 600;
    padding: 14px 28px; border-radius: 12px; min-width: 140px;
    transition: transform 0.12s ease, opacity 0.12s ease;
  }
  .picker a:active { transform: scale(0.96); opacity: 0.8; }
  .picker a.mac { background: #5E5CE6; }
  .picker a.ios { background: #007AFF; }
  .picker .hint { margin-top: 18px; font-size: 12px; color: #8E8E93; }
</style>
<script>
(function () {
  var ua = navigator.userAgent || '';
  var isMobile = /iPhone|iPad|iPod|Android|Mobile/i.test(ua);
  var q = new URLSearchParams(location.search);
  var forced = q.get('platform');
  var target = forced === 'macos' ? 'macos.html'
    : forced === 'ios' ? 'ios.html'
    : isMobile ? 'ios.html' : 'macos.html';
  // 自动跳转：显式 ?platform=macos|ios 强制指定，缺省按 UA 检测；本页仅作兜底选择页
  location.replace(target + (location.search ? '&' : '?') + 'from=auto');
})();
</script>
</head>
<body>
  <div class="picker">
    <div class="logo">🎬</div>
    <h1>视频下载器</h1>
    <p>选择界面版本开始使用</p>
    <div class="btns">
      <a class="mac" href="/macos.html">Mac 桌面版</a>
      <a class="ios" href="/ios.html">iPhone / iPad 版</a>
    </div>
    <div class="hint">自动检测设备跳转 · 也可手动选择</div>
  </div>
</body>
</html>
