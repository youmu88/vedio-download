<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎬 DMXQ 视频下载器</title>
<script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f14;
    --surface: rgba(255,255,255,0.04);
    --surface-hover: rgba(255,255,255,0.08);
    --border: rgba(255,255,255,0.08);
    --text: #e8e8ed;
    --text-secondary: #9898a8;
    --accent: #5b9aff;
    --accent-hover: #4a7de8;
    --green: #34d399;
    --yellow: #fbbf24;
    --red: #f87171;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }
  .container {
    width: 100%;
    max-width: 720px;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 32px;
  }
  .header h1 {
    font-size: 24px;
    font-weight: 700;
    background: linear-gradient(135deg, #5b9aff, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header .badge {
    background: rgba(91,154,255,0.15);
    color: var(--accent);
    font-size: 11px;
    padding: 2px 10px;
    border-radius: 20px;
    font-weight: 600;
  }
  .status-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 6px;
  }
  .status-dot.connected { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .status-dot.disconnected { background: var(--red); box-shadow: 0 0 8px var(--red); }
  .connection-status {
    margin-left: auto;
    font-size: 12px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
  }

  /* Input Area */
  .input-area {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    backdrop-filter: blur(20px);
    margin-bottom: 28px;
    transition: border-color 0.2s;
  }
  .input-area:focus-within {
    border-color: var(--accent);
  }
  .input-row {
    display: flex;
    gap: 12px;
  }
  .input-row input {
    flex: 1;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }
  .input-row input::placeholder { color: var(--text-secondary); }
  .input-row input:focus { border-color: var(--accent); }
  .input-row .btn-download {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    padding: 12px 28px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .input-row .btn-download:hover { background: var(--accent-hover); transform: translateY(-1px); }
  .input-row .btn-download:active { transform: translateY(0); }
  .input-row .btn-download:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }
  .input-hint {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 10px;
  }

  /* Section Title */
  .section-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 16px;
    color: var(--text-secondary);
  }
  .section-title .count {
    margin-left: auto;
    font-size: 13px;
    background: var(--surface);
    padding: 2px 10px;
    border-radius: 20px;
  }

  /* Batch Action Bar */
  .batch-bar {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    margin-bottom: 12px;
    font-size: 13px;
  }
  .batch-bar.visible { display: flex; }
  .batch-bar .selected-count {
    color: var(--text-secondary);
    margin-right: auto;
  }
  .batch-bar .batch-btn {
    border: none;
    border-radius: var(--radius-sm);
    padding: 6px 16px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .batch-btn.retry {
    background: rgba(91,154,255,0.15);
    color: var(--accent);
  }
  .batch-btn.retry:hover { background: rgba(91,154,255,0.25); }
  .batch-btn.delete {
    background: rgba(248,113,113,0.12);
    color: var(--red);
  }
  .batch-btn.delete:hover { background: rgba(248,113,113,0.22); }
  .batch-btn.select-all {
    background: rgba(52,211,153,0.12);
    color: var(--green);
  }
  .batch-btn.select-all:hover { background: rgba(52,211,153,0.22); }
  .batch-btn.cancel {
    background: rgba(255,255,255,0.06);
    color: var(--text-secondary);
  }
  .batch-btn.cancel:hover { background: rgba(255,255,255,0.1); }

  /* Task List */
  .task-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .task-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    backdrop-filter: blur(20px);
    transition: all 0.2s;
    position: relative;
  }
  .task-card:hover { border-color: rgba(255,255,255,0.15); }
  .task-card.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent);
  }

  /* Checkbox */
  .task-checkbox {
    position: absolute;
    top: 16px;
    left: 16px;
    width: 18px;
    height: 18px;
    border: 2px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    background: transparent;
  }
  .task-checkbox:hover { border-color: var(--text-secondary); }
  .task-checkbox.checked {
    background: var(--accent);
    border-color: var(--accent);
  }
  .task-checkbox.checked::after {
    content: '✓';
    color: #fff;
    font-size: 12px;
    font-weight: 700;
  }

  .task-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    margin-left: 28px;
  }
  .task-status-icon {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .task-status-icon.pending { background: var(--text-secondary); }
  .task-status-icon.capturing { background: var(--yellow); animation: pulse 1.2s infinite; }
  .task-status-icon.downloading { background: var(--accent); animation: pulse 1.2s infinite; }
  .task-status-icon.done { background: var(--green); }
  .task-status-icon.failed { background: var(--red); }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .task-url {
    flex: 1;
    font-size: 13px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text-secondary);
  }
  .task-status-label {
    font-size: 12px;
    font-weight: 600;
    padding: 2px 10px;
    border-radius: 20px;
    background: rgba(255,255,255,0.06);
  }
  .task-status-label.pending { color: var(--text-secondary); }
  .task-status-label.capturing { color: var(--yellow); }
  .task-status-label.downloading { color: var(--accent); }
  .task-status-label.done { color: var(--green); }
  .task-status-label.failed { color: var(--red); }

  .task-progress {
    margin-bottom: 12px;
    margin-left: 28px;
  }
  .progress-bar-bg {
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.06);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.3s ease;
    background: linear-gradient(90deg, var(--accent), #a78bfa);
  }
  .progress-bar-fill.done { background: linear-gradient(90deg, var(--green), #34d399); }
  .progress-bar-fill.failed { background: var(--red); }
  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 6px;
  }
  .progress-info .speed { color: var(--text-secondary); }

  .task-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-left: 28px;
  }
  .task-actions button {
    border: none;
    border-radius: var(--radius-sm);
    padding: 6px 16px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-cancel {
    background: rgba(248,113,113,0.12);
    color: var(--red);
  }
  .btn-cancel:hover { background: rgba(248,113,113,0.2); }
  .btn-retry {
    background: rgba(91,154,255,0.12);
    color: var(--accent);
  }
  .btn-retry:hover { background: rgba(91,154,255,0.2); }
  .btn-delete-task {
    background: rgba(248,113,113,0.12);
    color: var(--red);
  }
  .btn-delete-task:hover { background: rgba(248,113,113,0.2); }
  .btn-download-file {
    background: rgba(52,211,153,0.12);
    color: var(--green);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    padding: 6px 16px;
    border-radius: var(--radius-sm);
    font-size: 12px;
    font-weight: 500;
    transition: all 0.2s;
  }
  .btn-download-file:hover { background: rgba(52,211,153,0.2); }

  .task-error {
    font-size: 12px;
    color: var(--red);
    margin-top: 8px;
    padding: 8px 12px;
    background: rgba(248,113,113,0.08);
    border-radius: var(--radius-sm);
    word-break: break-all;
    margin-left: 28px;
  }

  /* Phase labels - 双阶段进度 */
  .phase-label {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 4px;
    margin-bottom: 6px;
    display: inline-block;
    margin-left: 28px;
  }
  .phase-label.preparing { background: rgba(251,191,36,0.15); color: var(--yellow); }
  .phase-label.preparing_done { background: rgba(52,211,153,0.12); color: var(--green); }
  .phase-label.downloading { background: rgba(91,154,255,0.15); color: var(--accent); }
  .phase-label.done { background: rgba(52,211,153,0.12); color: var(--green); }
  .phase-label.failed { background: rgba(248,113,113,0.12); color: var(--red); }

  /* 进度信息加强 */
  .progress-message {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--text-secondary);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
  .empty-state p { font-size: 14px; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--surface);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 24px;
    font-size: 14px;
    color: var(--text);
    box-shadow: var(--shadow);
    transition: transform 0.3s ease;
    z-index: 999;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.toast-error { border-color: var(--red); }
  .toast.toast-success { border-color: var(--green); }

  /* Select All Checkbox */
  .select-all-area {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    padding: 8px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 13px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }
  .select-all-area:hover {
    background: var(--surface-hover);
    border-color: rgba(255,255,255,0.15);
  }
  .select-all-area .task-checkbox {
    position: static;
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }
  .select-all-area .select-all-label {
    flex: 1;
  }
  .select-all-area .select-all-hint {
    font-size: 11px;
    color: var(--text-secondary);
    opacity: 0.6;
  }

  @media (max-width: 600px) {
    body { padding: 20px 12px; }
    .input-row { flex-direction: column; }
    .input-row .btn-download { justify-content: center; }
    .task-card { padding: 16px; }
    .header h1 { font-size: 20px; }
    .task-header, .task-progress, .task-actions, .task-error, .phase-label {
      margin-left: 0;
    }
  }
</style>
</head>
<body>

<div class="container">

  <!-- Header -->
  <div class="header">
    <h1>🎬 视频下载器</h1>
    <span class="badge">v1.0</span>
    <div class="connection-status">
      <span class="status-dot disconnected" id="connDot"></span>
      <span id="connText">未连接</span>
    </div>
  </div>

  <!-- Input Area -->
  <div class="input-area">
    <div class="input-row">
      <input type="url" id="urlInput" placeholder="粘贴视频播放页 URL，例如 https://www.dmxq.info/vodplay/xxx.html" autocomplete="url" spellcheck="false">
      <button class="btn-download" id="downloadBtn" onclick="submitDownload()">
        <span>⬇</span> 下载
      </button>
    </div>
    <div class="input-hint">🔗 支持 dmxq.info 等在线播放网站的页面链接，后台自动拦截视频流</div>
  </div>

  <!-- Batch Action Bar -->
  <div class="batch-bar" id="batchBar">
    <span class="selected-count">已选择 <strong id="selectedCount">0</strong> 个任务</span>
    <button class="batch-btn select-all" onclick="toggleSelectAll()">✅ 全部选择</button>
    <button class="batch-btn cancel" onclick="clearSelection()">取消选择</button>
    <button class="batch-btn retry" onclick="batchRetry()">🔄 批量重试</button>
    <button class="batch-btn delete" onclick="batchDelete()">🗑 批量删除</button>
  </div>

  <!-- Task List -->
  <div class="section-title">
    📋 任务列表
    <span class="count" id="taskCount">0 个任务</span>
  </div>
  <!-- 全选区域 -->
  <div class="select-all-area" id="selectAllArea" onclick="toggleSelectAll()" style="display:none;">
    <div class="task-checkbox" id="selectAllCheckbox"></div>
    <span class="select-all-label">全选当前所有任务</span>
    <span class="select-all-hint">点击复选框切换全选/取消全选</span>
  </div>
  <div class="task-list" id="taskList">
    <div class="empty-state">
      <div class="icon">📥</div>
      <p>还没有下载任务</p>
      <p style="font-size:12px;margin-top:4px;">在上方输入播放页 URL 开始下载</p>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ─── 常量 & 状态 ──────────────────────────────────
const STATUS_MAP = {
  pending:     { label: '等待中',  icon: '⏳' },
  capturing:   { label: '解析中',  icon: '🔍' },
  downloading: { label: '下载中',  icon: '⬇'  },
  done:        { label: '已完成',  icon: '✅' },
  failed:      { label: '失败',    icon: '❌' },
};

// 已选中的任务 ID 集合
const selectedTasks = new Set();

// ─── Socket.io 连接 ────────────────────────────────
const socket = io(window.location.origin, { transports: ['websocket', 'polling'] });
const connDot = document.getElementById('connDot');
const connText = document.getElementById('connText');

socket.on('connect', () => {
  connDot.className = 'status-dot connected';
  connText.textContent = '已连接';
  connText.style.color = 'var(--green)';
  loadTasks();
});

socket.on('disconnect', () => {
  connDot.className = 'status-dot disconnected';
  connText.textContent = '未连接';
  connText.style.color = 'var(--red)';
});

socket.on('task-status', (task) => {
  updateTaskCard(task);
});

socket.on('task-list-update', (tasks) => {
  renderTaskList(tasks);
});

// ⭐ Socket.IO 房间清理：收到终态通知时自动退订，防止房间泄漏
socket.on('task-finalized', ({ taskId }) => {
  socket.emit('unsubscribe', taskId);
});

// ─── 选择/取消选择 ─────────────────────────────────
function toggleTaskSelection(taskId) {
  if (selectedTasks.has(taskId)) {
    selectedTasks.delete(taskId);
  } else {
    selectedTasks.add(taskId);
  }
  updateBatchBar();
  updateSelectAll();
  // 更新卡片选中样式
  const card = document.getElementById(`task-${taskId}`);
  if (card) {
    card.classList.toggle('selected', selectedTasks.has(taskId));
    const cb = card.querySelector('.task-checkbox');
    if (cb) cb.classList.toggle('checked', selectedTasks.has(taskId));
  }
}

function clearSelection() {
  // 清除所有选中样式
  for (const id of selectedTasks) {
    const card = document.getElementById(`task-${id}`);
    if (card) {
      card.classList.remove('selected');
      const cb = card.querySelector('.task-checkbox');
      if (cb) cb.classList.remove('checked');
    }
  }
  selectedTasks.clear();
  updateBatchBar();
  updateSelectAll();
}

// ─── 全选/取消全选 ─────────────────────────────────
function toggleSelectAll() {
  const tasks = document.querySelectorAll('.task-card');
  if (!tasks.length) return;

  // 判断当前是否"全部已选"：如果全部已选则取消全选，否则全选
  const allCardIds = [...tasks].map(card => card.id.replace('task-', ''));
  const allSelected = allCardIds.every(id => selectedTasks.has(id));

  if (allSelected) {
    // 取消全选
    for (const id of allCardIds) {
      selectedTasks.delete(id);
      const card = document.getElementById(`task-${id}`);
      if (card) {
        card.classList.remove('selected');
        const cb = card.querySelector('.task-checkbox');
        if (cb) cb.classList.remove('checked');
      }
    }
  } else {
    // 全选
    for (const id of allCardIds) {
      selectedTasks.add(id);
      const card = document.getElementById(`task-${id}`);
      if (card) {
        card.classList.add('selected');
        const cb = card.querySelector('.task-checkbox');
        if (cb) cb.classList.add('checked');
      }
    }
  }

  updateBatchBar();
  updateSelectAll();
}

function updateSelectAll() {
  const area = document.getElementById('selectAllArea');
  const cb = document.getElementById('selectAllCheckbox');
  const tasks = document.querySelectorAll('.task-card');
  
  if (!tasks.length) {
    area.style.display = 'none';
    return;
  }

  area.style.display = 'flex';
  
  const allCardIds = [...tasks].map(card => card.id.replace('task-', ''));
  const allSelected = allCardIds.every(id => selectedTasks.has(id));
  const someSelected = allCardIds.some(id => selectedTasks.has(id));

  cb.classList.toggle('checked', allSelected);
  // 部分选中时显示中间态（视觉上用半透明表示）
  cb.style.opacity = (!allSelected && someSelected) ? '0.5' : '1';
}

function updateBatchBar() {
  const bar = document.getElementById('batchBar');
  const count = document.getElementById('selectedCount');
  count.textContent = selectedTasks.size;
  bar.classList.toggle('visible', selectedTasks.size > 0);
}

// ─── 提交下载 ──────────────────────────────────────
async function submitDownload() {
  const input = document.getElementById('urlInput');
  const btn = document.getElementById('downloadBtn');
  const url = input.value.trim();

  if (!url) {
    showToast('请输入视频播放页 URL', 'error');
    input.focus();
    return;
  }

  if (!url.startsWith('http://') && !url.startsWith('https://')) {
    showToast('请输入有效的 URL（以 http:// 或 https:// 开头）', 'error');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '⏳ 提交中...';

  try {
    const res = await fetch('/api/download', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url }),
    });

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.error || `请求失败 (${res.status})`);
    }

    const data = await res.json();
    input.value = '';
    showToast('🎯 任务已创建，正在解析视频流...', 'success');

    // 订阅该任务
    socket.emit('subscribe', data.taskId);

    // 立即刷新列表
    loadTasks();
  } catch (err) {
    showToast(err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<span>⬇</span> 下载';
  }
}

// ─── 获取任务列表 ──────────────────────────────────
async function loadTasks() {
  try {
    const res = await fetch('/api/tasks');
    if (res.ok) {
      const tasks = await res.json();
      renderTaskList(tasks);
    }
  } catch (err) {
    // 静默失败，WebSocket 会补充
  }
}

// ─── 取消任务 ──────────────────────────────────────
async function cancelTask(taskId) {
  try {
    const res = await fetch(`/api/task/${taskId}`, { method: 'DELETE' });
    if (res.ok) {
      showToast('已取消任务', 'success');
      loadTasks();
    } else {
      const err = await res.json();
      showToast(err.error || '取消失败', 'error');
    }
  } catch (err) {
    showToast(err.message, 'error');
  }
}

// ─── 重试单个任务 ──────────────────────────────────
async function retryTask(taskId) {
  try {
    const res = await fetch(`/api/task/${taskId}/retry`, { method: 'POST' });
    const data = await res.json();
    if (res.ok) {
      showToast('🔄 任务已重新加入队列', 'success');
      socket.emit('subscribe', taskId);
      loadTasks();
    } else {
      showToast(data.error || '重试失败', 'error');
    }
  } catch (err) {
    showToast(err.message, 'error');
  }
}

// ─── 删除单个任务 ──────────────────────────────────
async function deleteTask(taskId) {
  if (!confirm('确定要删除此任务记录吗？')) return;
  try {
    const res = await fetch(`/api/task/${taskId}`, { method: 'DELETE' });
    const data = await res.json();
    if (res.ok) {
      showToast('🗑 任务已删除', 'success');
      selectedTasks.delete(taskId);
      updateBatchBar();
      loadTasks();
    } else {
      showToast(data.error || '删除失败', 'error');
    }
  } catch (err) {
    showToast(err.message, 'error');
  }
}

// ─── 批量重试 ──────────────────────────────────────
async function batchRetry() {
  const taskIds = [...selectedTasks];
  if (taskIds.length === 0) {
    showToast('请先选择要重试的任务', 'error');
    return;
  }

  try {
    const res = await fetch('/api/tasks/retry-batch', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ taskIds }),
    });
    const data = await res.json();
    if (res.ok) {
      showToast(`🔄 已重试 ${data.success} 个任务（${data.failed} 个跳过）`, 'success');
      // 订阅所有重试的任务
      for (const id of taskIds) socket.emit('subscribe', id);
      clearSelection();
      loadTasks();
    } else {
      showToast(data.error || '批量重试失败', 'error');
    }
  } catch (err) {
    showToast(err.message, 'error');
  }
}

// ─── 批量删除 ──────────────────────────────────────
async function batchDelete() {
  const taskIds = [...selectedTasks];
  if (taskIds.length === 0) {
    showToast('请先选择要删除的任务', 'error');
    return;
  }

  if (!confirm(`确定要删除 ${taskIds.length} 个任务的记录吗？`)) return;

  try {
    const res = await fetch('/api/tasks/delete-batch', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ taskIds }),
    });
    const data = await res.json();
    if (res.ok) {
      showToast(`🗑 已删除 ${data.success} 个任务（${data.failed} 个失败）`, 'success');
      clearSelection();
      loadTasks();
    } else {
      showToast(data.error || '批量删除失败', 'error');
    }
  } catch (err) {
    showToast(err.message, 'error');
  }
}

// ─── 渲染任务列表 ──────────────────────────────────
function renderTaskList(tasks) {
  const container = document.getElementById('taskList');
  const countEl = document.getElementById('taskCount');

  if (!tasks || tasks.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="icon">📥</div>
        <p>还没有下载任务</p>
        <p style="font-size:12px;margin-top:4px;">在上方输入播放页 URL 开始下载</p>
      </div>`;
    countEl.textContent = '0 个任务';
    return;
  }

  countEl.textContent = `${tasks.length} 个任务`;

  // 按创建时间倒序：新任务在上面
  const sorted = [...tasks].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

  let html = '';
  for (const task of sorted) {
    html += buildTaskCard(task);
  }
  container.innerHTML = html;

  // 恢复选中状态
  for (const id of selectedTasks) {
    const card = document.getElementById(`task-${id}`);
    if (card) {
      card.classList.add('selected');
      const cb = card.querySelector('.task-checkbox');
      if (cb) cb.classList.add('checked');
    }
  }
}

// ─── 阶段标签映射 ──────────────────────────────────
const PHASE_LABEL = {
  preparing:      { label: '🔍 准备中（解析视频）',      cls: 'preparing' },
  preparing_done: { label: '✅ 准备完成，即将下载',     cls: 'preparing_done' },
  downloading:    { label: '⬇ 下载中',                  cls: 'downloading' },
};

// ─── 构建任务卡片 HTML ─────────────────────────────
function buildTaskCard(task) {
  const status = task.status || 'pending';
  const statusInfo = STATUS_MAP[status] || { label: status, icon: '❓' };
  const progress = task.progress || 0;
  const speed = task.speed || '';
  const phase = task.phase || '';
  const isDone = status === 'done';
  const isFailed = status === 'failed';
  const isActive = status === 'downloading' || status === 'capturing' || status === 'pending';
  const fileName = task.outputFile ? task.outputFile.split('/').pop() || task.outputFile : '';

  const isSelected = selectedTasks.has(task.id);
  const checkboxClass = `task-checkbox${isSelected ? ' checked' : ''}`;

  let progressClass = 'progress-bar-fill';
  if (isDone) progressClass += ' done';
  else if (isFailed) progressClass += ' failed';

  // 下载链接
  let downloadLink = '';
  if (isDone && fileName) {
    downloadLink = `<a href="/downloads/${encodeURIComponent(fileName)}" class="btn-download-file" download>⬇ 下载文件</a>`;
  } else if (isDone && task.outputFile) {
    downloadLink = `<a href="/downloads/${encodeURIComponent(task.outputFile.split('/').pop())}" class="btn-download-file" download>⬇ 下载文件</a>`;
  }

  // 取消按钮（仅 active 状态显示）
  let cancelBtn = '';
  if (isActive) {
    cancelBtn = `<button class="btn-cancel" onclick="cancelTask('${task.id}')">✕ 取消</button>`;
  }

  // 重试按钮（仅失败状态显示）
  let retryBtn = '';
  if (isFailed) {
    retryBtn = `<button class="btn-retry" onclick="retryTask('${task.id}')">🔄 重试</button>`;
  }

  // 删除按钮（所有状态都显示）
  let deleteBtn = `<button class="btn-delete-task" onclick="deleteTask('${task.id}')">🗑 删除</button>`;

  const errorHtml = task.error ? `<div class="task-error">⚠ ${escapeHtml(task.error)}</div>` : '';

  // 阶段标签
  let phaseHtml = '';
  let messageHtml = '';
  if (phase && PHASE_LABEL[phase]) {
    phaseHtml = `<div class="phase-label ${phase}">${PHASE_LABEL[phase].label}</div>`;
  }
  if (task.message) {
    messageHtml = `<div class="progress-message" title="${escapeHtml(task.message)}">${escapeHtml(task.message)}</div>`;
  }

  let percentLabel = `${progress}%`;
  if (isDone) percentLabel = '100%';

  return `
    <div class="task-card${isSelected ? ' selected' : ''}" id="task-${task.id}" data-status="${status}">
      <div class="${checkboxClass}" data-task-id="${task.id}"></div>
      <div class="task-header">
        <span class="task-status-icon ${status}"></span>
        <span class="task-url" title="${escapeHtml(task.url)}">${escapeHtml(task.url)}</span>
        <span class="task-status-label ${status}">${statusInfo.icon} ${statusInfo.label}</span>
      </div>
      ${phaseHtml}
      <div class="task-progress">
        <div class="progress-bar-bg">
          <div class="${progressClass}" style="width:${progress}%"></div>
        </div>
        <div class="progress-info">
          <span>${percentLabel}</span>
          ${speed ? `<span class="speed">${speed}</span>` : ''}
        </div>
        ${messageHtml}
      </div>
      ${errorHtml}
      <div class="task-actions">
        ${retryBtn}
        ${cancelBtn}
        ${deleteBtn}
        ${downloadLink}
      </div>
    </div>
  `;
}

// ─── 更新单个任务卡 ────────────────────────────────
function updateTaskCard(task) {
  const existing = document.getElementById(`task-${task.id}`);
  if (existing) {
    existing.outerHTML = buildTaskCard(task);
    // 恢复选中状态
    if (selectedTasks.has(task.id)) {
      const card = document.getElementById(`task-${task.id}`);
      if (card) {
        card.classList.add('selected');
        const cb = card.querySelector('.task-checkbox');
        if (cb) cb.classList.add('checked');
      }
    }
  } else {
    loadTasks();
  }
}

// ─── Toast 通知 ────────────────────────────────────
let toastTimer = null;
function showToast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast' + (type ? ` toast-${type}` : '');
  void el.offsetWidth;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 4000);
}

// ─── 工具函数 ──────────────────────────────────────
function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ─── 事件委托：复选框点击 ─────────────────────────
// 使用事件委托监听 taskList 容器上的复选框点击，避免 DOM 替换导致事件丢失
document.getElementById('taskList').addEventListener('click', (e) => {
  const checkbox = e.target.closest('.task-checkbox');
  if (!checkbox) return;
  const taskId = checkbox.dataset.taskId;
  if (!taskId) return;
  e.stopPropagation();
  toggleTaskSelection(taskId);
});

// ─── 回车提交 ──────────────────────────────────────
document.getElementById('urlInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') submitDownload();
});

// ─── 初始加载 ──────────────────────────────────────
console.log('🎬 视频下载器前端已加载');
</script>
</body>
</html>
