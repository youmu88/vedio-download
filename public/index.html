<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎬 DMXQ 视频下载器</title>
<script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f14;
    --surface: rgba(255,255,255,0.04);
    --surface-hover: rgba(255,255,255,0.08);
    --border: rgba(255,255,255,0.08);
    --text: #e8e8ed;
    --text-secondary: #9898a8;
    --accent: #5b9aff;
    --accent-hover: #4a7de8;
    --green: #34d399;
    --yellow: #fbbf24;
    --red: #f87171;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }
  .container {
    width: 100%;
    max-width: 720px;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 32px;
  }
  .header h1 {
    font-size: 24px;
    font-weight: 700;
    background: linear-gradient(135deg, #5b9aff, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header .badge {
    background: rgba(91,154,255,0.15);
    color: var(--accent);
    font-size: 11px;
    padding: 2px 10px;
    border-radius: 20px;
    font-weight: 600;
  }
  .status-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 6px;
  }
  .status-dot.connected { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .status-dot.disconnected { background: var(--red); box-shadow: 0 0 8px var(--red); }
  .connection-status {
    margin-left: auto;
    font-size: 12px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
  }

  /* Input Area */
  .input-area {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    backdrop-filter: blur(20px);
    margin-bottom: 28px;
    transition: border-color 0.2s;
  }
  .input-area:focus-within {
    border-color: var(--accent);
  }
  .input-row {
    display: flex;
    gap: 12px;
  }
  .input-row input {
    flex: 1;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }
  .input-row input::placeholder { color: var(--text-secondary); }
  .input-row input:focus { border-color: var(--accent); }
  .input-row .btn-download {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    padding: 12px 28px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .input-row .btn-download:hover { background: var(--accent-hover); transform: translateY(-1px); }
  .input-row .btn-download:active { transform: translateY(0); }
  .input-row .btn-download:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }
  .input-hint {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 10px;
  }

  /* Section Title */
  .section-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 16px;
    color: var(--text-secondary);
  }
  .section-title .count {
    margin-left: auto;
    font-size: 13px;
    background: var(--surface);
    padding: 2px 10px;
    border-radius: 20px;
  }

  /* Task List */
  .task-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .task-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    backdrop-filter: blur(20px);
    transition: all 0.2s;
  }
  .task-card:hover { border-color: rgba(255,255,255,0.15); }
  .task-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .task-status-icon {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .task-status-icon.pending { background: var(--text-secondary); }
  .task-status-icon.capturing { background: var(--yellow); animation: pulse 1.2s infinite; }
  .task-status-icon.downloading { background: var(--accent); animation: pulse 1.2s infinite; }
  .task-status-icon.done { background: var(--green); }
  .task-status-icon.failed { background: var(--red); }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .task-url {
    flex: 1;
    font-size: 13px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text-secondary);
  }
  .task-status-label {
    font-size: 12px;
    font-weight: 600;
    padding: 2px 10px;
    border-radius: 20px;
    background: rgba(255,255,255,0.06);
  }
  .task-status-label.pending { color: var(--text-secondary); }
  .task-status-label.capturing { color: var(--yellow); }
  .task-status-label.downloading { color: var(--accent); }
  .task-status-label.done { color: var(--green); }
  .task-status-label.failed { color: var(--red); }

  .task-progress {
    margin-bottom: 12px;
  }
  .progress-bar-bg {
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.06);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.3s ease;
    background: linear-gradient(90deg, var(--accent), #a78bfa);
  }
  .progress-bar-fill.done { background: linear-gradient(90deg, var(--green), #34d399); }
  .progress-bar-fill.failed { background: var(--red); }
  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 6px;
  }
  .progress-info .speed { color: var(--text-secondary); }

  .task-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }
  .task-actions button {
    border: none;
    border-radius: var(--radius-sm);
    padding: 6px 16px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-cancel {
    background: rgba(248,113,113,0.12);
    color: var(--red);
  }
  .btn-cancel:hover { background: rgba(248,113,113,0.2); }
  .btn-download-file {
    background: rgba(52,211,153,0.12);
    color: var(--green);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    padding: 6px 16px;
    border-radius: var(--radius-sm);
    font-size: 12px;
    font-weight: 500;
    transition: all 0.2s;
  }
  .btn-download-file:hover { background: rgba(52,211,153,0.2); }

  .task-error {
    font-size: 12px;
    color: var(--red);
    margin-top: 8px;
    padding: 8px 12px;
    background: rgba(248,113,113,0.08);
    border-radius: var(--radius-sm);
    word-break: break-all;
  }

  /* Phase labels - 双阶段进度 */
  .phase-label {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 4px;
    margin-bottom: 6px;
    display: inline-block;
  }
  .phase-label.preparing { background: rgba(251,191,36,0.15); color: var(--yellow); }
  .phase-label.preparing_done { background: rgba(52,211,153,0.12); color: var(--green); }
  .phase-label.downloading { background: rgba(91,154,255,0.15); color: var(--accent); }
  .phase-label.done { background: rgba(52,211,153,0.12); color: var(--green); }
  .phase-label.failed { background: rgba(248,113,113,0.12); color: var(--red); }

  /* 进度信息加强 */
  .progress-message {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--text-secondary);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
  .empty-state p { font-size: 14px; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--surface);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 24px;
    font-size: 14px;
    color: var(--text);
    box-shadow: var(--shadow);
    transition: transform 0.3s ease;
    z-index: 999;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.toast-error { border-color: var(--red); }
  .toast.toast-success { border-color: var(--green); }

  @media (max-width: 600px) {
    body { padding: 20px 12px; }
    .input-row { flex-direction: column; }
    .input-row .btn-download { justify-content: center; }
    .task-card { padding: 16px; }
    .header h1 { font-size: 20px; }
  }
</style>
</head>
<body>

<div class="container">

  <!-- Header -->
  <div class="header">
    <h1>🎬 视频下载器</h1>
    <span class="badge">v1.0</span>
    <div class="connection-status">
      <span class="status-dot disconnected" id="connDot"></span>
      <span id="connText">未连接</span>
    </div>
  </div>

  <!-- Input Area -->
  <div class="input-area">
    <div class="input-row">
      <input type="url" id="urlInput" placeholder="粘贴视频播放页 URL，例如 https://www.dmxq.info/vodplay/xxx.html" autocomplete="url" spellcheck="false">
      <button class="btn-download" id="downloadBtn" onclick="submitDownload()">
        <span>⬇</span> 下载
      </button>
    </div>
    <div class="input-hint">🔗 支持 dmxq.info 等在线播放网站的页面链接，后台自动拦截视频流</div>
  </div>

  <!-- Task List -->
  <div class="section-title">
    📋 任务列表
    <span class="count" id="taskCount">0 个任务</span>
  </div>
  <div class="task-list" id="taskList">
    <div class="empty-state">
      <div class="icon">📥</div>
      <p>还没有下载任务</p>
      <p style="font-size:12px;margin-top:4px;">在上方输入播放页 URL 开始下载</p>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ─── 常量 & 状态 ──────────────────────────────────
const STATUS_MAP = {
  pending:     { label: '等待中',  icon: '⏳' },
  capturing:   { label: '解析中',  icon: '🔍' },
  downloading: { label: '下载中',  icon: '⬇'  },
  done:        { label: '已完成',  icon: '✅' },
  failed:      { label: '失败',    icon: '❌' },
};

// ─── Socket.io 连接 ────────────────────────────────
const socket = io(window.location.origin, { transports: ['websocket', 'polling'] });
const connDot = document.getElementById('connDot');
const connText = document.getElementById('connText');

socket.on('connect', () => {
  connDot.className = 'status-dot connected';
  connText.textContent = '已连接';
  connText.style.color = 'var(--green)';
  loadTasks();
});

socket.on('disconnect', () => {
  connDot.className = 'status-dot disconnected';
  connText.textContent = '未连接';
  connText.style.color = 'var(--red)';
});

socket.on('task-status', (task) => {
  updateTaskCard(task);
});

socket.on('task-list-update', (tasks) => {
  renderTaskList(tasks);
});

// ─── 提交下载 ──────────────────────────────────────
async function submitDownload() {
  const input = document.getElementById('urlInput');
  const btn = document.getElementById('downloadBtn');
  const url = input.value.trim();

  if (!url) {
    showToast('请输入视频播放页 URL', 'error');
    input.focus();
    return;
  }

  if (!url.startsWith('http://') && !url.startsWith('https://')) {
    showToast('请输入有效的 URL（以 http:// 或 https:// 开头）', 'error');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '⏳ 提交中...';

  try {
    const res = await fetch('/api/download', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url }),
    });

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.error || `请求失败 (${res.status})`);
    }

    const data = await res.json();
    input.value = '';
    showToast('🎯 任务已创建，正在解析视频流...', 'success');

    // 订阅该任务
    socket.emit('subscribe', data.taskId);

    // 立即刷新列表
    loadTasks();
  } catch (err) {
    showToast(err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<span>⬇</span> 下载';
  }
}

// ─── 获取任务列表 ──────────────────────────────────
async function loadTasks() {
  try {
    const res = await fetch('/api/tasks');
    if (res.ok) {
      const tasks = await res.json();
      renderTaskList(tasks);
    }
  } catch (err) {
    // 静默失败，WebSocket 会补充
  }
}

// ─── 取消任务 ──────────────────────────────────────
async function cancelTask(taskId) {
  try {
    const res = await fetch(`/api/task/${taskId}`, { method: 'DELETE' });
    if (res.ok) {
      showToast('已取消任务', 'success');
      loadTasks();
    } else {
      const err = await res.json();
      showToast(err.error || '取消失败', 'error');
    }
  } catch (err) {
    showToast(err.message, 'error');
  }
}

// ─── 渲染任务列表 ──────────────────────────────────
function renderTaskList(tasks) {
  const container = document.getElementById('taskList');
  const countEl = document.getElementById('taskCount');

  if (!tasks || tasks.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="icon">📥</div>
        <p>还没有下载任务</p>
        <p style="font-size:12px;margin-top:4px;">在上方输入播放页 URL 开始下载</p>
      </div>`;
    countEl.textContent = '0 个任务';
    return;
  }

  countEl.textContent = `${tasks.length} 个任务`;

  // 按创建时间倒序：新任务在上面
  const sorted = [...tasks].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

  let html = '';
  for (const task of sorted) {
    html += buildTaskCard(task);
  }
  container.innerHTML = html;
}

// ─── 阶段标签映射 ──────────────────────────────────
const PHASE_LABEL = {
  preparing:      { label: '🔍 准备中（解析视频）',      cls: 'preparing' },
  preparing_done: { label: '✅ 准备完成，即将下载',     cls: 'preparing_done' },
  downloading:    { label: '⬇ 下载中',                  cls: 'downloading' },
};

// ─── 构建任务卡片 HTML ─────────────────────────────
function buildTaskCard(task) {
  const status = task.status || 'pending';
  const statusInfo = STATUS_MAP[status] || { label: status, icon: '❓' };
  const progress = task.progress || 0;
  const speed = task.speed || '';
  const phase = task.phase || '';
  const isDone = status === 'done';
  const isFailed = status === 'failed';
  const isActive = status === 'downloading' || status === 'capturing' || status === 'pending';
  const fileName = task.outputFile ? task.outputFile.split('/').pop() || task.outputFile : '';

  let progressClass = 'progress-bar-fill';
  if (isDone) progressClass += ' done';
  else if (isFailed) progressClass += ' failed';

  // 下载链接
  let downloadLink = '';
  if (isDone && fileName) {
    downloadLink = `<a href="/downloads/${encodeURIComponent(fileName)}" class="btn-download-file" download>⬇ 下载文件</a>`;
  } else if (isDone && task.outputFile) {
    downloadLink = `<a href="/downloads/${encodeURIComponent(task.outputFile.split('/').pop())}" class="btn-download-file" download>⬇ 下载文件</a>`;
  }

  // 取消按钮
  let cancelBtn = '';
  if (isActive) {
    cancelBtn = `<button class="btn-cancel" onclick="cancelTask('${task.id}')">✕ 取消</button>`;
  }

  const errorHtml = task.error ? `<div class="task-error">⚠ ${task.error}</div>` : '';

  // 阶段标签（仅在 preparing / downloading 阶段显示）
  let phaseHtml = '';
  let messageHtml = '';
  if (phase && PHASE_LABEL[phase]) {
    phaseHtml = `<div class="phase-label ${phase}">${PHASE_LABEL[phase].label}</div>`;
  }
  if (task.message) {
    messageHtml = `<div class="progress-message" title="${escapeHtml(task.message)}">${escapeHtml(task.message)}</div>`;
  }

  // 进度百分比显示：下载阶段显示实际百分比，准备阶段也显示实际百分比
  let percentLabel = `${progress}%`;
  if (phase === 'preparing') {
    percentLabel = `${progress}%`;
  } else if (phase === 'downloading') {
    percentLabel = `${progress}%`;
  } else if (isDone) {
    percentLabel = '100%';
  }

  return `
    <div class="task-card" id="task-${task.id}" data-status="${status}">
      <div class="task-header">
        <span class="task-status-icon ${status}"></span>
        <span class="task-url" title="${escapeHtml(task.url)}">${escapeHtml(task.url)}</span>
        <span class="task-status-label ${status}">${statusInfo.icon} ${statusInfo.label}</span>
      </div>
      ${phaseHtml}
      <div class="task-progress">
        <div class="progress-bar-bg">
          <div class="${progressClass}" style="width:${progress}%"></div>
        </div>
        <div class="progress-info">
          <span>${percentLabel}</span>
          ${speed ? `<span class="speed">${speed}</span>` : ''}
        </div>
        ${messageHtml}
      </div>
      ${errorHtml}
      <div class="task-actions">
        ${cancelBtn}
        ${downloadLink}
      </div>
    </div>
  `;
}

// ─── 更新单个任务卡（无需重新渲染整个列表）────────
function updateTaskCard(task) {
  const existing = document.getElementById(`task-${task.id}`);
  if (existing) {
    existing.outerHTML = buildTaskCard(task);
  } else {
    // 任务不在列表中，刷新整个列表
    loadTasks();
  }
}

// ─── Toast 通知 ────────────────────────────────────
let toastTimer = null;
function showToast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast' + (type ? ` toast-${type}` : '');
  // 触发重排
  void el.offsetWidth;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 4000);
}

// ─── 工具函数 ──────────────────────────────────────
function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ─── 回车提交 ──────────────────────────────────────
document.getElementById('urlInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') submitDownload();
});

// ─── 初始加载 ──────────────────────────────────────
console.log('🎬 视频下载器前端已加载');
</script>
</body>
</html>
